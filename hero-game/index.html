<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.E.R.O. - Helicopter Emergency Rescue Operation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <h1>H.E.R.O.</h1>
            <div id="score-panel">
                <div class="stat">
                    <span class="label">SCORE:</span>
                    <span id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">VIDAS:</span>
                    <span id="lives">5</span>
                </div>
                <div class="stat">
                    <span class="label">NIVEL:</span>
                    <span id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label">DINAMITA:</span>
                    <span id="dynamite">6</span>
                </div>
                <div class="stat">
                    <span class="label">ENERGÍA:</span>
                    <span id="energy">100</span>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="controls-info">
            <p><strong>CONTROLES:</strong> ← → Mover | ↑ Volar | ↓ Descender | ESPACIO Disparar | ESPACIO+↓ Dinamita | ESC Menú</p>
        </div>
        <div id="error-message" style="display:none; color: #ff3333; background: #330000; padding: 15px; margin: 10px; text-align: center; border: 2px solid #ff0000; border-radius: 5px;"></div>
    </div>

    <!-- Scripts del juego - ORDEN CRÍTICO -->
    <script src="js/utils.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/laser.js"></script>
    <script src="js/dynamite.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/player.js"></script>
    <script src="js/level.js"></script>
    <script src="js/highscore.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
